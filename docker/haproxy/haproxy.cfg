global
    log stdout format raw local0
    maxconn 300
    stats timeout 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcpka
    option redispatch
    retries 2
    timeout connect 3s
    timeout client 30m
    timeout server 30m

# Docker Desktop resuelve los nombres de servicio en 127.0.0.11. Se usa el
# resolver de HAProxy para no quedarse con una IP vieja si un contenedor
# se recrea.
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold other 5s

# Punto único de conexión para la aplicación y el generador.
# HAProxy solo envía tráfico al nodo que Patroni reporta como primario.
frontend postgres_frontend
    bind *:5432
    mode tcp
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    balance roundrobin
    option httpchk GET /primary
    http-check expect status 200
    default-server check inter 2s fastinter 1s downinter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server postgres-master  postgres-master:5432  check port 8008 resolvers docker_dns init-addr last,libc,none
    server postgres-replica postgres-replica:5432  check port 8008 resolvers docker_dns init-addr last,libc,none

# Consola de estadísticas de HAProxy. Solo se publica en 127.0.0.1:7000.
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats show-node
    stats admin if TRUE
    option httplog
